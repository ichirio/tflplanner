template: km_simple
data:
- step: read
  dataset: ADTTE
- step: param
  value: TTDE
- step: flag
  variable: SAFFL
- step: time_unit
  variable: AVAL
  unit: days
- step: survfit
  name: fit
  time: AVAL
  censor: CNSR
  by: TRT01A
plot:
  x_label: Time (Days)
  y_label: Probability of No Dermatologic Event
  colour_by: TRT01A
  palette: treatment
  legend: inside
  x_min: 0.0
  y_min: 0.0
  y_max: 1.0
  y_by: 0.2
  width: 8.33
  height: 4.79
  dpi: 300.0
  units: in
  base_size: 10.0
  theme: boxed
layers:
- layer: km_curve
  linewidth: 0.3
- layer: censor_mark
  shape: x
  size: 3.0
  stroke: 0.6
- layer: hline
  yintercept: 0.5
  linetype: dashed
  colour: grey50
  linewidth: 0.3
- layer: ard_number
  analysis_id: KM
  variable: prob
  level: 0.5
  stat: estimate
  group: TRT01A = Placebo
  label: 'Median (days), Placebo: {value}'
  digits: 0.0
  x: 0.0
  'y': -Inf
  hjust: 0.0
  vjust: -3.6
- layer: ard_number
  analysis_id: KM
  variable: prob
  level: 0.5
  stat: estimate
  group: TRT01A = Xanomeline Low Dose
  label: 'Median (days), Xanomeline Low Dose: {value}'
  digits: 0.0
  x: 0.0
  'y': -Inf
  hjust: 0.0
  vjust: -2.1
- layer: ard_number
  analysis_id: KM
  variable: prob
  level: 0.5
  stat: estimate
  group: TRT01A = Xanomeline High Dose
  label: 'Median (days), Xanomeline High Dose: {value}'
  digits: 0.0
  x: 0.0
  'y': -Inf
  hjust: 0.0
  vjust: -0.6

