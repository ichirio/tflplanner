template: km_simple
data:
- step: read
  dataset: ADTTE
- step: param
  value: TTDE
- step: flag
  variable: SAFFL
- step: time_unit
  variable: AVAL
  unit: days
stats:
- step: survfit
  name: fit
  time: AVAL
  censor: CNSR
  by: TRT01A
plot:
  x_label: Time (Days)
  y_label: Probability of No Dermatologic Event
  colour_by: TRT01A
  palette: treatment
  legend: inside
  x_min: 0.0
  y_min: 0.0
  y_max: 1.0
  y_by: 0.2
  width: 8.33
  height: 4.79
  dpi: 300.0
  units: in
  base_size: 10.0
  theme: boxed
layers:
- layer: km_curve
  linewidth: 0.3
- layer: censor_mark
  shape: x
  size: 3.0
  stroke: 0.6
- layer: hline
  yintercept: 0.5
  linetype: dashed
  colour: grey50
  linewidth: 0.3

