id: T-14-2-2
kind: table
label: 'Time to first dermatologic event: KM estimates'
population: SAF
extends:
  - defaults
ard:
  analysis_data:
    - id: adsl_saf
      label: Safety set
      from: ADSL
      population: SAF
    - id: adtte_saf_ttde
      label: Time to first dermatologic event, safety set
      from: ADTTE
      subjects: adsl_saf
      where: !r PARAMCD == "TTDE"
  analyses:
    - id: GROUPN
      method: categorical
      data: adsl_saf
      variables:
        - TRT01A
      purpose: PRIMARY OUTCOME MEASURE
    - id: KM
      label: Kaplan-Meier estimates
      method: custom
      data: adtte_saf_ttde
      code: !r |-
        fit <- survival::survfit(survival::Surv(AVAL, CNSR == 0) ~ TRT01A, data = data)
        cards::bind_ard(
          cardx::ard_survival_survfit(fit, probs = 0.5),
          cardx::ard_survival_survfit(fit, times = c(0, 30, 60, 90, 120, 150, 180)),
          .quiet = TRUE
        )
      purpose: PRIMARY OUTCOME MEASURE
    - id: HR
      label: Hazard ratio vs placebo (Cox), not printed in the table
      method: custom
      data: adtte_saf_ttde
      code: !r |-
        cox <- survival::coxph(survival::Surv(AVAL, CNSR == 0) ~ TRT01A, data = data)
        cardx::ard_regression(cox, exponentiate = TRUE)
      purpose: SECONDARY OUTCOME MEASURE
data:
  source: ard
  object: ard
  steps:
    - !r |-
      data <- normalize_ard(ard)
      # row labels: the median, and the event-free probability by day (day 0 left out)
      is_time <- data$variable == "time"
      data$.label[data$variable == "prob"] <- "Median (95% CI)"
      data$.label[is_time] <- paste("Day", as.character(data$variable_level[is_time]))
      data <- data[!(is_time & as.character(data$variable_level) == "0"), ]
codelists:
  TRT01A:
    - value: Placebo
    - value: Xanomeline Low Dose
    - value: Xanomeline High Dose
content:
  - table_plan:
      cols: TRT01A
      rows:
        group: variable
  - plan_levels:
      TRT01A:
        - Placebo
        - Xanomeline Low Dose
        - Xanomeline High Dose
  - plan_labels:
      prob: Time to first event (days)
      time: Event-free probability (95% CI)
  - plan_cells:
      prob:
        - !r is.na(estimate) ~ "NE"
        - '{estimate:.0f} ({conf.low:.0f}, {conf.high:.0f})'
      time: '{estimate:.1f%} ({conf.low:.1f%}, {conf.high:.1f%})'
  - plan_col_header:
      header:
        - line: '1'
          cols: row_label
        - line: '1'
          cols: .values
          span: each
          text: '{col}'
        - line: '2'
          cols: row_label
        - line: '2'
          cols: .values
          span: each
          text: (N={n})
page:
  footer:
    '1':
      left: 'Dermatologic event: first treatment-emergent skin and subcutaneous tissue
        disorder or application site event; censored at the end of treatment.'
    '2':
      left: Kaplan-Meier estimates; 95% CI of the median by the Brookmeyer-Crowley
        method (log transformation). NE = not estimable.
  tokens:
    OUTPUT_TITLE: 'Time to First Dermatologic Event: Kaplan-Meier Estimates'
    OUTPUT_POPULATION: Safety Analysis Set
note: KM estimates

