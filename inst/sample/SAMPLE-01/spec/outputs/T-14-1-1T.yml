# T-14-1-1 written as a template SPEC: tflspec_v1/demog with the arguments
# that give the code SPEC's report (T-14-1-1C, tflspec's
# inst/extdata/spec-yaml/outputs/T-14-1-1.yml with the canon ids).  The
# decimals are the series' formats (AGE:mean 1, AGE:sd 2, median 1, N, min,
# max 0: the code SPEC's plan_digits).  Its style named (the series'
# style otherwise; T-14-1-1C takes the study's).
id: T-14-1-1T
kind: table
label: Demographics
common:
  population: SAF
  treatment: TRT01A
codelists:
  TRT01A:
    - {value: Drug X, label: Drug X 200 mg}
    - {value: Control, label: Control 100 mg}
template:
  name: tflspec_v1/demog
  analysis:
    by: [TRT01A]
    continuous: [AGE]
    categorical: [AGEGR1, SEX, RACE, ECOGBL]
    missing_row: false
  content:
    labels: {AGE: "Age (years)", AGEGR1: "Age group, n (%)", SEX: "Sex, n (%)", RACE: "Race, n (%)", ECOGBL: "Baseline ECOG, n (%)"}
    cells:
      n: "{N}"
      Mean (SD): "{mean} ({sd})"
      Median: "{median}"
      Min, Max: "{min}, {max}"
    max_rows: 30
page:
  titles:
    1: {center: Table 14.1.1}
    2: {center: Demographic Characteristics}
  footnotes:
    1: {left: "SD = Standard Deviation."}
  tokens: {OUTPUT_POPULATION: Safety Analysis Set}
style: standard
