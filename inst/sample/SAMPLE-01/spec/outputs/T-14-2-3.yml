id: T-14-2-3
kind: table
label: 'Systolic blood pressure: mean change at Week 24 (95% CI), p-value; the ARD
  also holds the test''s method and alternative as text'
population: SAF
extends:
  - defaults
ard:
  analysis_data:
    - id: adsl_saf
      label: Safety set
      from: ADSL
      population: SAF
    - id: advs_saf_sysbp
      label: Systolic blood pressure at Week 24, safety set
      from: ADVS
      subjects: adsl_saf
      where: !r PARAMCD == "SYSBP" & AVISIT == "Week 24"
  analyses:
    - id: GROUPN
      method: categorical
      data: adsl_saf
      variables:
        - TRTA
      purpose: PRIMARY OUTCOME MEASURE
    - id: 'N'
      label: Subjects
      method: continuous
      data: advs_saf_sysbp
      by:
        - TRTA
      variables:
        - CHG
      statistics:
        - 'N'
      purpose: PRIMARY OUTCOME MEASURE
    - id: CI
      label: Mean change (95% CI), one-sample t-test
      method: mean_ci
      data: advs_saf_sysbp
      by:
        - TRTA
      variables:
        - CHG
      purpose: SECONDARY OUTCOME MEASURE
data:
  source: ard
  object: ard
codelists:
  TRTA:
    - value: Placebo
    - value: Xanomeline Low Dose
    - value: Xanomeline High Dose
content:
  - table_plan:
      cols: TRTA
      rows:
        group: variable
  - plan_levels:
      TRTA:
        - Placebo
        - Xanomeline Low Dose
        - Xanomeline High Dose
  - plan_labels:
      CHG: Change from baseline at Week 24 (mmHg)
  - plan_cells:
      continuous:
        'n': '{N:.0f}'
        Mean (95% CI): '{estimate:.1f} ({conf.low:.1f}, {conf.high:.1f})'
        p-value: '{p.value:.3f}'
  - plan_paginate_rows:
      max_rows: 24
page:
  footer:
    '1':
      left: 'CI = Confidence Interval.  95% CI and p-value: one-sample t-test of the
        change from baseline (H0: mean change = 0).'
    '2':
      left: Systolic blood pressure after 5 minutes lying down.
  tokens:
    OUTPUT_TITLE: 'Systolic Blood Pressure (mmHg): Mean Change from Baseline at Week
      24 (95% CI)'
    OUTPUT_POPULATION: Safety Analysis Set
note: 'SYSBP change at Week 24: mean (95% CI), p-value'

