id: T-14-1-1C
kind: table
label: Demographics (a code SPEC)
common:
  population: SAF
  treatment: TRT01A
extends:
  - defaults
data:
  - id: adsl_sub
    from: ADSL
analysis:
  analyses:
    - id: BIGN
      method: cards::ard_tabulate
      data: adsl_sub
      variables:
        - TRT01A
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: AGE
      method: cards::ard_summary
      data: adsl_sub
      by:
        - TRT01A
      variables:
        - AGE
      statistics:
        - 'N'
        - mean
        - sd
        - median
        - min
        - max
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: AGEGR1
      method: cards::ard_tabulate
      data: adsl_sub
      by:
        - TRT01A
      variables:
        - AGEGR1
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: SEX
      method: cards::ard_tabulate
      data: adsl_sub
      by:
        - TRT01A
      variables:
        - SEX
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: RACE
      method: cards::ard_tabulate
      data: adsl_sub
      by:
        - TRT01A
      variables:
        - RACE
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: ECOGBL
      method: cards::ard_tabulate
      data: adsl_sub
      by:
        - TRT01A
      variables:
        - ECOGBL
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
codelists:
  TRT01A:
    - value: Drug X
      label: Drug X 200 mg
    - value: Control
      label: Control 100 mg
content:
  - table_plan:
      cols: TRT01A
      rows:
        group: variable
  - plan_cells:
      continuous:
        'n': '{N}'
        Mean (SD): '{mean} ({sd})'
        Median: '{median}'
        Min, Max: '{min}, {max}'
  - plan_labels:
      variable:
        AGE: Age (years)
        AGEGR1: Age group, n (%)
        SEX: Sex, n (%)
        RACE: Race, n (%)
        ECOGBL: Baseline ECOG, n (%)
  - plan_digits:
      continuous:
        'N': 0
        mean: 1
        sd: 2
        median: 1
        min: 0
        max: 0
  - plan_paginate_rows:
      max_rows: 30
      split: group_safe
page:
  footnotes:
    '1':
      left: SD = Standard Deviation.
  tokens:
    OUTPUT_TITLE: Demographic Characteristics
    OUTPUT_POPULATION: Safety Analysis Set

