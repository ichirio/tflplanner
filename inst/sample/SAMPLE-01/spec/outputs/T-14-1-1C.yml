# T-14-1-1 (tflspec's code SPEC, inst/extdata/spec-yaml/outputs/T-14-1-1.yml)
# with the canon analysis ids: one BIGN (the arms' N, was GROUPN) and an
# analysis a variable, its id the variable's name (was CONT and CAT; canon
# 1bf77ba).  And the statistics under the key the code SPEC reads,
# statistics: (the original's statistic: map is no key of an analysis and
# is dropped: its ARD has p25 and p75 too).  The twin of T-14-1-1T.
id: T-14-1-1C
kind: table
label: Demographics
common:
  population: SAF
  treatment: TRT01A
extends: [defaults]
data:
  - id: adsl_sub
    from: ADSL
ard:
  analyses:
    - id: BIGN
      method: cards::ard_tabulate
      data: adsl_sub
      variables: [TRT01A]
    - id: AGE
      method: cards::ard_summary
      data: adsl_sub
      by: [TRT01A]
      variables: [AGE]
      statistics: [N, mean, sd, median, min, max]
    - id: AGEGR1
      method: cards::ard_tabulate
      data: adsl_sub
      by: [TRT01A]
      variables: [AGEGR1]
    - id: SEX
      method: cards::ard_tabulate
      data: adsl_sub
      by: [TRT01A]
      variables: [SEX]
    - id: RACE
      method: cards::ard_tabulate
      data: adsl_sub
      by: [TRT01A]
      variables: [RACE]
    - id: ECOGBL
      method: cards::ard_tabulate
      data: adsl_sub
      by: [TRT01A]
      variables: [ECOGBL]
codelists:
  TRT01A:
    - {value: Drug X, label: Drug X 200 mg}
    - {value: Control, label: Control 100 mg}
content:
  - table_plan: {cols: TRT01A, rows: {group: variable}}
  - plan_labels: {AGE: "Age (years)", AGEGR1: "Age group, n (%)", SEX: "Sex, n (%)", RACE: "Race, n (%)", ECOGBL: "Baseline ECOG, n (%)"}
  - plan_cells:
      continuous:
        n: "{N}"
        Mean (SD): "{mean} ({sd})"
        Median: "{median}"
        Min, Max: "{min}, {max}"
  - plan_digits: {continuous: {N: 0, mean: 1, sd: 2, median: 1, min: 0, max: 0}}
  - plan_paginate_rows: {max_rows: 30, split: group_safe}
page:
  titles:
    1: {center: Table 14.1.1}
    2: {center: Demographic Characteristics}
  footnotes:
    1: {left: "SD = Standard Deviation."}
  tokens: {OUTPUT_POPULATION: Safety Analysis Set}
