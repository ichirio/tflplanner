id: T-14-3-1C
kind: table
label: TEAEs by SOC / PT (a code SPEC)
style: compact
extends:
  - defaults
codelists:
  TRT01A:
    - value: Drug X
    - value: Control
data:
  - id: adsl_saf
    from: ADSL
    population: SAF
  - id: adae_saf
    from: ADAE
    subjects_in: adsl_saf
    where: !r TRTEMFL == "Y"
analysis:
  analyses:
    - id: BIGN
      label: Subjects per group
      method: categorical
      data: adsl_saf
      variables:
        - TRT01A
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
    - id: AE
      label: TEAE by SOC / PT
      method: hierarchical
      data: adae_saf
      by:
        - TRT01A
      variables:
        - AEBODSYS
        - AEDECOD
      denominator: adsl_saf
      formats:
        - N=0
        - mean=2
        - sd=3
        - median=1
        - min=0
        - max=0
        - p=xx.x%
        - AGE:mean=1
        - AGE:sd=2
      args: !r over_variables = TRUE
      purpose: PRIMARY OUTCOME MEASURE
      analysis_per: level
content:
  - normalize_ard:
      hierarchy:
        - AEBODSYS
        - AEDECOD
      overall: Any TEAE
  - table_plan:
      cols: TRT01A
      rows:
        group1: AEBODSYS
      label:
        label: AEDECOD
  - plan_sort:
      keys:
        - .overall
        - group1
        - .depth
        - -n
        - label
  - plan_col_header:
      header:
        - line: '1'
          cols: row_label
        - line: '1'
          cols: .values
          span: each
          text: |-
            {col}
            (N={n})
            n (%)
        - line: '2'
          cols: row_label
          text: |-
            System Organ Class
               Preferred Term
        - line: '2'
          cols: .values
  - plan_paginate_rows:
      max_rows: 22
      split: group_force
page:
  footer:
    '1':
      left: Subjects are counted once per system organ class and once per preferred
        term.
  tokens:
    OUTPUT_TITLE: Treatment-Emergent Adverse Events by System Organ Class and Preferred
      Term
    OUTPUT_POPULATION: Safety Analysis Set
note: TEAE by SOC / PT, frequency descending

