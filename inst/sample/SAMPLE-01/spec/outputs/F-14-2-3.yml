id: F-14-2-3
kind: figure
label: KM curves of the time to first skin disorder (designed)
extends:
  - defaults
data:
  source: code
  steps:
    - step: read
      dataset: ADTTE
    - step: param
      value: TTSKIN
    - step: flag
      variable: SAFFL
    - step: time_unit
      variable: AVAL
      unit: days
    - step: survfit
      name: fit
      time: AVAL
      censor: CNSR
      by: TRT01A
content:
  - km_curve:
      linewidth: 0.3
  - censor_mark:
      shape: x
      size: 3.0
      stroke: 0.6
  - hline:
      yintercept: 0.5
      linetype: dashed
      colour: grey50
      linewidth: 0.3
  - ard_number:
      analysis_id: KM
      variable: prob
      level: 0.5
      stat: estimate
      group: TRT01A = Drug X
      label: 'Median (days), Drug X: {value}'
      digits: 0.0
      x: 0.0
      'y': -Inf
      hjust: 0.0
      vjust: -2.1
  - ard_number:
      analysis_id: KM
      variable: prob
      level: 0.5
      stat: estimate
      group: TRT01A = Control
      label: 'Median (days), Control: {value}'
      digits: 0.0
      x: 0.0
      'y': -Inf
      hjust: 0.0
      vjust: -0.6
  - ard_number:
      analysis_id: HR
      variable: TRT01A
      level: Drug X
      stat: estimate
      label: 'HR, Drug X vs Control: {value} (95% CI {conf.low}, {conf.high})'
      digits: 2.0
      x: Inf
      'y': 0.15
      hjust: 1.02
      vjust: -0.6
page:
  footer:
    '1':
      left: 'x = censored.  Dashed line: the median (probability 0.5).  The medians
        are those of Table 14.2.2; the hazard ratios (Cox model) are in its ARD.'
  tokens:
    OUTPUT_TITLE: Kaplan-Meier Curves of Time to First Treatment-Emergent Skin Disorder
    OUTPUT_POPULATION: Safety Analysis Set
  rtf_page:
    orientation: landscape
  report:
    ard_source: table:T-14-2-2
template: km_simple
plot:
  x_label: Time (Days)
  y_label: Probability of No Skin Disorder
  colour_by: TRT01A
  palette: treatment
  legend: inside
  x_min: 0.0
  y_min: 0.0
  y_max: 1.0
  y_by: 0.2
  dpi: 300.0
  base_size: 10.0
  theme: boxed

