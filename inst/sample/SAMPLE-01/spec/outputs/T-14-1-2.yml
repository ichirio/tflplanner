id: T-14-1-2
kind: table
label: Subject disposition
extends:
  - defaults
codelists:
  TRT01A:
    - value: Drug X
    - value: Control
  EOSSTT:
    - value: ONGOING
      label: Ongoing (in follow-up)
    - value: DISCONTINUED
      label: Discontinued
data:
  - id: adsl_saf
    from: ADSL
    population: SAF
analysis:
  analyses:
    - id: BIGN
      method: categorical
      data: adsl_saf
      variables:
        - TRT01A
      purpose: PRIMARY OUTCOME MEASURE
    - id: DISP
      label: Status at end of study
      method: categorical
      data: adsl_saf
      by:
        - TRT01A
      variables:
        - EOSSTT
      statistics:
        - 'n'
        - p
      purpose: PRIMARY OUTCOME MEASURE
content:
  - table_plan:
      cols: TRT01A
      rows:
        group: variable
  - plan_labels:
      variable:
        EOSSTT: Status at end of study, n (%)
  - plan_paginate_rows:
      max_rows: 24
page:
  tokens:
    OUTPUT_TITLE: Subject Disposition
    OUTPUT_POPULATION: Safety Analysis Set
note: Disposition

