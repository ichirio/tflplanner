id: T-14-1-1S
kind: table
label: Demographic characteristics (its ARD one ard_stack call)
population: SAF
extends:
  - defaults
ard:
  analysis_data:
    - id: adsl_saf
      label: Safety set
      from: ADSL
      population: SAF
  analyses:
    - id: DEMOG
      label: Demographics, run together
      method: cards::ard_stack
      data: adsl_saf
      by:
        - TRT01A
      purpose: PRIMARY OUTCOME MEASURE
    - id: CONT
      parent: DEMOG
      label: Continuous
      method: continuous
      variables:
        - AGE
      statistics:
        - 'N'
        - mean
        - sd
        - median
        - min
        - max
      purpose: PRIMARY OUTCOME MEASURE
    - id: CAT
      parent: DEMOG
      label: Categorical
      method: categorical
      variables:
        - AGEGR1
        - SEX
        - RACE
        - ETHNIC
      statistics:
        - 'n'
        - p
      purpose: PRIMARY OUTCOME MEASURE
data:
  source: ard
  object: ard
codelists:
  TRT01A:
    - value: Placebo
    - value: Xanomeline Low Dose
    - value: Xanomeline High Dose
  SEX:
    - value: F
      label: Female
    - value: M
      label: Male
  AGEGR1:
    - value: 18-64
      label: 18-64 years
    - value: '>64'
      label: '>64 years'
  RACE:
    - value: WHITE
      label: White
    - value: BLACK OR AFRICAN AMERICAN
      label: Black or African American
    - value: ASIAN
      label: Asian
    - value: AMERICAN INDIAN OR ALASKA NATIVE
      label: American Indian or Alaska Native
    - value: NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
      label: Native Hawaiian or Other Pacific Islander
  ETHNIC:
    - value: HISPANIC OR LATINO
      label: Hispanic or Latino
    - value: NOT HISPANIC OR LATINO
      label: Not Hispanic or Latino
    - value: NOT REPORTED
      label: Not reported
    - value: UNKNOWN
      label: Unknown
content:
  - table_plan:
      cols: TRT01A
      rows:
        group: variable
  - plan_levels:
      TRT01A:
        - Placebo
        - Xanomeline Low Dose
        - Xanomeline High Dose
      SEX:
        - Female
        - Male
      AGEGR1:
        - 18-64 years
        - '>64 years'
      RACE:
        - White
        - Black or African American
        - Asian
        - American Indian or Alaska Native
        - Native Hawaiian or Other Pacific Islander
      ETHNIC:
        - Hispanic or Latino
        - Not Hispanic or Latino
        - Not reported
        - Unknown
  - plan_labels:
      AGE: Age (years)
      AGEGR1: Age group, n (%)
      SEX: Sex, n (%)
      RACE: Race, n (%)
      ETHNIC: Ethnicity, n (%)
  - plan_cells:
      continuous:
        'n': '{N:.0f}'
        Mean (SD): '{mean:.1f} ({sd:.2f})'
        Median: '{median:.1f}'
        Min, Max: '{min:.0f}, {max:.0f}'
  - plan_paginate_rows:
      max_rows: 30
      split: group_safe
page:
  footer:
    '1':
      left: SD = Standard Deviation.
  tokens:
    OUTPUT_TITLE: Demographic Characteristics
    OUTPUT_POPULATION: Safety Analysis Set
note: Demographics

