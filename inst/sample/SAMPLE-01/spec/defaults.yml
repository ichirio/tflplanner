content:
  - normalize_ard: {}
  - plan_cells:
      default: '{n:.0f} ({p:.1f%})'
  - plan_digits:
      rounding: sas
  - plan_col_header:
      header:
        - line: '1'
          cols: row_label
        - line: '1'
          cols: .values
          span: each
          text: '{col}'
        - line: '2'
          cols: row_label
          text: Characteristic
        - line: '2'
          cols: .values
          span: each
          text: (N={n})
  - plan_stub:
      name: row_label
      before: true
      heading: ''
  - plan_blanks:
      where: between_groups
      first: true
      last: true
      counted: true
  - plan_columns:
      widths:
        row_label: 40.0
        .values: 18.0
  - plan_style:
      align_count_pct: true
styles:
  standard:
    page:
      header:
        first:
          '1':
            left: Sample Pharma (tflplanner sample)
            right: DRAFT
          '2':
            left: 'Protocol: SAMPLE-01 (tflspec''s oncology sample data)'
            right: Page {PAGE} of {TOTAL_PAGES}
          '3': []
          '4':
            center: '{OUTPUT_LABEL}'
          '5':
            center: '{OUTPUT_TITLE}'
          '6':
            center: ({OUTPUT_POPULATION})
      footer:
        last:
          '98':
            left: 'Source: tflspec''s oncology sample study XYZ-ONC-01 (simulated
              ADaM data; not real patients).'
          '99':
            left: '{PROGRAM}       Generated on: {DATETIME}'
  compact:
    page:
      header:
        first:
          '1':
            left: Sample Pharma (tflplanner sample)
            right: DRAFT
          '2':
            left: 'Protocol: SAMPLE-01 (tflspec''s oncology sample data)'
            right: Page {PAGE} of {TOTAL_PAGES}
          '3': []
          '4':
            center: '{OUTPUT_LABEL}'
          '5':
            center: '{OUTPUT_TITLE}'
          '6':
            center: ({OUTPUT_POPULATION})
      footer:
        last:
          '98':
            left: 'Source: tflspec''s oncology sample study XYZ-ONC-01 (simulated
              ADaM data; not real patients).'
          '99':
            left: '{PROGRAM}       Generated on: {DATETIME}'
      rtf_page:
        margin_top_in: 0.5
        margin_bottom_in: 0.5
        margin_left_in: 0.5
        margin_right_in: 0.5
      rtf_style:
        font_size_half_points: 16

