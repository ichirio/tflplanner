content:
  - normalize_ard: {}
  - plan_cells:
      default: '{n:.0f} ({p:.1f%})'
  - plan_digits:
      rounding: sas
  - plan_col_header:
      header:
        - line: '1'
          cols: row_label
        - line: '1'
          cols: .values
          span: each
          text: '{col}'
        - line: '2'
          cols: row_label
          text: Characteristic
        - line: '2'
          cols: .values
          span: each
          text: (N={n})
  - plan_stub:
      name: row_label
      before: true
      heading: ''
  - plan_blanks:
      where: between_groups
      first: true
      last: true
      counted: true
  - plan_columns:
      widths:
        row_label: 40.0
        .values: 18.0
  - plan_style:
      align_count_pct: true
# The study's code lists, as read from its define.xml: each variable's
# values as the ADaM data holds them, in the order of its N variable
# (TRT01AN, TRT01PN, AGEGR1N) or, without one, the define's order, and the
# words a table prints for each.  A report's own list for a variable takes
# this one's place.
codelists:
  TRT01A:
    - value: Drug X
      label: Drug X
    - value: Control
      label: Control
  TRT01P:
    - value: Drug X
      label: Drug X
    - value: Control
      label: Control
  SEX:
    - value: F
      label: Female
    - value: M
      label: Male
  AGEGR1:
    - value: <65
      label: <65 years
    - value: '>=65'
      label: '>=65 years'
  RACE:
    - value: WHITE
      label: White
    - value: BLACK OR AFRICAN AMERICAN
      label: Black or African American
    - value: ASIAN
      label: Asian
    - value: AMERICAN INDIAN OR ALASKA NATIVE
      label: American Indian or Alaska Native
    - value: NATIVE HAWAIIAN OR OTHER PACIFIC ISLANDER
      label: Native Hawaiian or Other Pacific Islander
    - value: OTHER
      label: Other
  ETHNIC:
    - value: HISPANIC OR LATINO
      label: Hispanic or Latino
    - value: NOT HISPANIC OR LATINO
      label: Not Hispanic or Latino
    - value: NOT REPORTED
      label: Not reported
    - value: UNKNOWN
      label: Unknown
styles:
  standard:
    page:
      header:
        first:
          '1':
            left: Sample Pharma (tflplanner sample)
            right: DRAFT
          '2':
            left: 'Protocol: SAMPLE-01 (tflspec''s oncology sample data)'
            right: Page {PAGE} of {TOTAL_PAGES}
          '3': []
          '4':
            center: '{OUTPUT_LABEL}'
          '5':
            center: '{OUTPUT_TITLE}'
          '6':
            center: ({OUTPUT_POPULATION})
      footer:
        last:
          '98':
            left: 'Source: tflspec''s oncology sample study XYZ-ONC-01 (simulated
              ADaM data; not real patients).'
          '99':
            left: '{PROGRAM}       Generated on: {DATETIME}'
  compact:
    page:
      header:
        first:
          '1':
            left: Sample Pharma (tflplanner sample)
            right: DRAFT
          '2':
            left: 'Protocol: SAMPLE-01 (tflspec''s oncology sample data)'
            right: Page {PAGE} of {TOTAL_PAGES}
          '3': []
          '4':
            center: '{OUTPUT_LABEL}'
          '5':
            center: '{OUTPUT_TITLE}'
          '6':
            center: ({OUTPUT_POPULATION})
      footer:
        last:
          '98':
            left: 'Source: tflspec''s oncology sample study XYZ-ONC-01 (simulated
              ADaM data; not real patients).'
          '99':
            left: '{PROGRAM}       Generated on: {DATETIME}'
      rtf_page:
        margin_top_in: 0.5
        margin_bottom_in: 0.5
        margin_left_in: 0.5
        margin_right_in: 0.5
      rtf_style:
        font_size_half_points: 16

