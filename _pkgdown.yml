url: https://ichirio.github.io/tflplanner/

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#1f4e79"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

# As rtfreporter: published at the root, and the README's badges are shown.
development:
  mode: unreleased
  version_label: warning

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: "tflplanner 利用ガイド（日本語）"
          href: articles/ja-guide.html
        - text: "プロットデザイナーで図を作る（日本語）"
          href: articles/ja-figures.html

articles:
  - title: Guides
    navbar: ~
    contents:
      - articles/ja-guide
      - articles/ja-figures

reference:
  - title: The app and its home
    contents:
      - run_app
      - setup_tflplanner
      - tflplanner_home
      - tflplanner_config
      - tr
  - title: Install, update and launch
    desc: >
      What is done at the R console: the setup, the packages, the updates
      and a shortcut that starts the app with a double click.
    contents:
      - add_shortcut
      - launch_app
      - update_tflplanner
      - tflplanner_packages
  - title: Company standards
    contents:
      - standards_template
      - code_templates
      - add_standard_defaults
  - title: Studies
