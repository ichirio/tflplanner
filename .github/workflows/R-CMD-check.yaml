# Standard R-CMD-check workflow, derived from r-lib/actions examples.
# Matrix covers the platforms and R versions CRAN expects.
on:
  push:
    branches: [main, master, next]
  # (a pull request into next runs quick-check.yaml instead)
  pull_request:
    branches-ignore: [next]
  # nightly, on next (a schedule runs the default branch's copy of this file;
  # each job checks out next): every test, the slow files the quick check
  # leaves out among them
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

# On next, a newer push cancels the run still going (nobody waits for it);
# main and pull requests keep every run (each run is its own group).
concurrency:
  group: ${{ github.ref == 'refs/heads/next' && format('{0}-next', github.workflow) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Every test file, the slow ones the quick check leaves out
  # (skip_if_quick(), TFLPLANNER_QUICK) among them, with the counts and the
  # slowest files in the job summary.  4 workers: setup-r sets
  # options(Ncpus = 1), which testthat reads before TESTTHAT_CPUS.
  full-tests:
    runs-on: ubuntu-latest
    name: full tests (ubuntu-latest, R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'next' || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Install the package
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Tests (all)
        env:
          TESTTHAT_CPUS: 4
          TFLPLANNER_QUICK: false
        shell: Rscript {0}
        run: |
          options(Ncpus = 4L)
          pkg <- read.dcf("DESCRIPTION", fields = "Package")[1L, 1L]
          library(pkg, character.only = TRUE)
          res <- testthat::test_dir("tests/testthat", package = pkg, load_package = "installed",
                                    reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                                    stop_on_failure = FALSE)
          d <- as.data.frame(res)
          by_file <- aggregate(cbind(real, nb) ~ file, d, sum)
          by_file <- by_file[order(-by_file$real), ]
          out <- c("## Tests (all)",
                   sprintf("%d files, %d tests, %d expectations; %d failed, %d errors, %d skipped",
                           length(unique(d$file)), nrow(d), sum(d$nb), sum(d$failed),
                           sum(d$error), sum(d$skipped)),
                   "", "The slowest files (seconds, summed over their tests):", "```",
                   sprintf("%-40s %7.1f %6d", by_file$file, by_file$real, by_file$nb)[seq_len(min(25L, nrow(by_file)))],
                   "```")
          cat(out, sep = "\n")
          cat(out, file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = "\n", append = TRUE)
          if (sum(d$failed) > 0L || any(d$error)) quit(status = 1L)

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel',     http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: '4.3'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
        with:
          # the nightly run checks next (empty: the event's own ref)
          ref: ${{ github.event_name == 'schedule' && 'next' || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The minimum environment: R at DESCRIPTION's `Depends` and every direct
  # dependency at the minimum DESCRIPTION names (`pkg@<minimum>`); the
  # suggested packages with no minimum, and every indirect dependency, come
  # from CRAN as it was on PPM_DATE (a dated Posit Package Manager snapshot,
  # the first with the newest minimum: cardx 0.3.4, on CRAN on 2026-07-06).  rtfreporter and tflspec come
  # from their `next` (Remotes).  The recommended environment -- the latest R
  # with the latest packages -- is the matrix's release jobs.  Why each
  # minimum: inst/validation/dependency-minimums.md.
  minimum-environment:
    runs-on: ubuntu-24.04

    name: ubuntu-24.04 (R 4.3, minimum environment)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_MIN: '4.3'
      PPM_DATE: '2026-07-07'
      # suggested packages left out (space-separated): the newest one the
      # snapshot has needs a newer package than the minimum of a direct
      # dependency (chromote: later >= 1.1.0; ggsurvfit 1.2.0: ggplot2 >= 4.0.0, so
      # ggsurvfit 1.1.0 is installed as an extra), so it
      # cannot be installed with them (the check lets a suggested package be missing)
      LEFT_OUT: 'chromote ggsurvfit'

    steps:
      - uses: actions/checkout@v4
        with:
          # the nightly run checks next (empty: the event's own ref)
          ref: ${{ github.event_name == 'schedule' && 'next' || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_MIN }}
          use-public-rspm: false

      # CRAN as it was on PPM_DATE, as binaries for this Ubuntu (noble); pak
      # reads the repos option, and the user agent makes PPM serve binaries
      - name: CRAN as on PPM_DATE
        shell: bash
        run: |
          sudo tee -a "$(R RHOME)/etc/Rprofile.site" > /dev/null <<EOF
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/${PPM_DATE}"),
                  HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
                                          paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])))
          EOF
          Rscript -e 'print(getOption("repos"))'

      # pak refs from DESCRIPTION: `pkg@<minimum>` where it names a minimum,
      # `any::pkg` where it does not (the suggested packages); R must be
      # DESCRIPTION's minimum.  The packages that ship with R, and the ones
      # that come from `next`, are not named.
      - name: The minimum versions, from DESCRIPTION
        id: pins
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION", fields = c("Depends", "Imports", "Suggests"))[1, ]
          r_min <- sub("^.*R [(]>= *([0-9.]+)[)].*$", "\\1", d[["Depends"]])
          if (!identical(r_min, Sys.getenv("R_MIN")) ||
              !identical(paste(R.version$major, sub("[.].*$", "", R.version$minor), sep = "."), r_min)) {
            stop("R_MIN (", Sys.getenv("R_MIN"), ") and this R (", getRversion(),
                 ") must be DESCRIPTION's Depends: R (>= ", r_min, ")")
          }
          s <- trimws(strsplit(paste(d[["Imports"]], d[["Suggests"]], sep = ","), ",")[[1L]])
          s <- s[nzchar(s)]
          pkg <- sub("\\s*[(].*$", "", s)
          min <- ifelse(grepl("[(]>=", s), sub("^.*[(]>=\\s*([^)]+)[)].*$", "\\1", s), NA)
          shipped <- c(rownames(installed.packages(priority = c("base", "recommended"))), "tcltk")
          left_out <- strsplit(Sys.getenv("LEFT_OUT"), " ")[[1L]]
          keep <- !(pkg %in% c("rtfreporter", "tflspec", left_out)) & !(pkg %in% shipped & is.na(min))
          refs <- ifelse(is.na(min), paste0("any::", pkg), paste0(pkg, "@", min))[keep]
          cat(paste(refs, collapse = "\n"), "\n")
          cat(sprintf("refs=%s\n", paste(refs, collapse = " ")),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # no `needs: check`: the pinned packages' own Config/Needs/check
          # (shiny's: shinytest2) would ask for newer packages than the minimums
          extra-packages: any::rcmdcheck ${{ steps.pins.outputs.refs }} ggsurvfit@1.1.0

      - name: The repository and the versions installed
        shell: Rscript {0}
        run: |
          print(getOption("repos"))
          # what pak resolved from: the lockfile setup-r-dependencies wrote
          lock <- tryCatch(readLines(".github/pkg.lock", warn = FALSE), error = function(e) character())
          urls <- regmatches(lock, regexpr("https?://[^\"]+", lock))
          cat("Where the lockfile's packages come from:\n")
          print(table(sub("^(https?://[^/]+/[^/]+/[^/]+/[^/]+/[^/]+).*$", "\\1", urls)))
          s <- read.dcf("DESCRIPTION", fields = c("Imports", "Suggests"))[1, ]
          s <- trimws(strsplit(paste(s, collapse = ","), ",")[[1L]])
          s <- s[nzchar(s)]
          pkg <- sub("\\s*[(].*$", "", s)
          ver <- vapply(pkg, function(p) tryCatch(as.character(utils::packageVersion(p)),
                                                 error = function(e) "not installed"), "")
          print(data.frame(depends = s, installed = ver), row.names = FALSE)

      # R_CRAN_WEB: `R CMD check` asks CRAN's web pages which suggested packages
      # are on CRAN, and the dated repository has none (the check stopped there
      # and rcmdcheck still reported success; the next step makes sure it did not)
      - uses: r-lib/actions/check-r-package@v2
        env:
          R_CRAN_WEB: https://cloud.r-project.org
          _R_CHECK_FORCE_SUGGESTS_: 'false'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: The check ran to its end
        shell: Rscript {0}
        run: |
          log <- list.files("check", pattern = "^00check[.]log$", recursive = TRUE, full.names = TRUE)
          stopifnot(length(log) == 1L)
          x <- readLines(log, warn = FALSE)
          print(tail(x, 8))
          stopifnot(any(grepl("^Status:", x)))
