# A pull request into next: one quick job -- the package installed and its
# tests run, on ubuntu with R release; no --as-cran, no other platforms,
# no pkgdown -- so that next does not queue behind the full matrix.
# The full R-CMD-check -- and every test, the slow files the quick check
# leaves out (TFLPLANNER_QUICK) among them -- still runs on each push to next
# (the latest head only), on pull requests into main, and nightly.
on:
  pull_request:
    branches: [next]

name: quick-check

permissions:
  contents: read

# a newer push to the same pull request cancels the run still going
concurrency:
  group: quick-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: tests (ubuntu-latest, R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Install the package
        run: R CMD INSTALL --no-docs --no-multiarch .

      # 4 workers (Config/testthat/parallel): setup-r sets options(Ncpus = 1),
      # which testthat reads before TESTTHAT_CPUS -- the tests ran in one
      # process ("Starting 1 test process").  TFLPLANNER_QUICK leaves out the
      # slowest files (skip_if_quick(), tests/testthat/helper.R); they run on
      # each push to next, on pull requests into main and nightly
      # (R-CMD-check.yaml's full-tests).
      - name: Tests
        env:
          TESTTHAT_CPUS: 4
          TFLPLANNER_QUICK: true
        shell: Rscript {0}
        run: |
          options(Ncpus = 4L)
          pkg <- read.dcf("DESCRIPTION", fields = "Package")[1L, 1L]
          library(pkg, character.only = TRUE)
          res <- testthat::test_dir("tests/testthat", package = pkg, load_package = "installed",
                                    reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                                    stop_on_failure = FALSE)
          d <- as.data.frame(res)
          by_file <- aggregate(cbind(real, nb) ~ file, d, sum)
          by_file <- by_file[order(-by_file$real), ]
          out <- c("## Tests (quick: TFLPLANNER_QUICK=true)",
                   sprintf("%d files, %d tests, %d expectations; %d failed, %d errors, %d skipped",
                           length(unique(d$file)), nrow(d), sum(d$nb), sum(d$failed),
                           sum(d$error), sum(d$skipped)),
                   "", "The slowest files (seconds, summed over their tests):", "```",
                   sprintf("%-40s %7.1f %6d", by_file$file, by_file$real, by_file$nb)[seq_len(min(15L, nrow(by_file)))],
                   "```")
          cat(out, sep = "\n")
          cat(out, file = Sys.getenv("GITHUB_STEP_SUMMARY"), sep = "\n", append = TRUE)
          if (sum(d$failed) > 0L || any(d$error)) quit(status = 1L)
