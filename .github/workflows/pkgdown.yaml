# Build a pkgdown site and deploy it to GitHub Pages.
# Derived from r-lib/actions examples (as rtfreporter's).
on:
  push:
    branches: [main, master]
  # (a pull request into next runs quick-check.yaml instead)
  pull_request:
    branches-ignore: [next]
  release:
    types: [published]
  # Nightly, 16:00 UTC = 1:00 JST: build next (no deploy), so a broken
  # article shows before the daily next -> main merge at about 2:00 JST.
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: "Build next only, as the nightly run does (no deploy)"
        type: boolean
        default: false

name: pkgdown

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs; the nightly build of next
    # has a group of its own, so it never cancels or waits on a main deploy
    concurrency:
      group: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'pkgdown-nightly' || format('pkgdown-{0}', github.event_name != 'pull_request' || github.run_id) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # true on the nightly build of next: build only, no deploy
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'next' || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && env.NIGHTLY != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # Re-write gh-pages as a single-commit branch each deploy.
          force_orphan: true
          user_name:  "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy pkgdown site (${{ github.sha }})"
